<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order</title>
</head>
<body>

<h1>Ordering Page</h1>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="post" action="{% url 'place_order' %}">
    {% csrf_token %}

    {% for item in menu_items %}

        <p>
            {{ item.name }}

            {% if item.price %}
                - ${{ item.price }}
            {% endif %}

            <label>
                Quantity:
                <input
                    type="number"
                    name="quantity_{{ item.id }}"
                    value="0"
                    min="0"
                >
            </label>
        </p>

    {% empty %}

        <p>No menu items are currently available.</p>

    {% endfor %}

    <button type="submit">Place Order</button>

</form>

</body>
</html>
