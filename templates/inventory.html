<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory</title>
</head>
<body>

    <h1>Current Inventory</h1>

    {% for ingredient in ingredients %}
        <p>
            {{ ingredient.name }}:
            {{ ingredient.quantity }} {{ ingredient.unit }}

            {% if ingredient.quantity <= ingredient.low_alert %}
                - LOW STOCK
            {% endif %}

            <form method="POST" action="{% url 'add_ingredient_qty' ingredient.id %}">
                {% csrf_token %}
                <input type="number" name="quantity" placeholder="Add quantity">
                <button type="submit">Add to Inventory</button>
            </form>
        </p>
    {% empty %}
        <p>No ingredients are currently in inventory.</p>
    {% endfor %}

</body>
</html>
